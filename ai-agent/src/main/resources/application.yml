server:
  # 应用启动端口，本地访问地址示例：http://localhost:8089/agent-rag
  port: 8089
  tomcat:
    # 统一请求 URI 编码，避免中文路径或参数乱码
    uri-encoding: UTF-8
  servlet:
    # 应用上下文路径，所有接口都会带此前缀
    context-path: /agent-rag

spring:
  profiles:
    # 默认启用开发环境配置；生产部署时应通过启动参数或环境变量切换为 prod
    active: @spring.profiles.active@
  ai:
    model:
      # 聊天模型由数据库配置动态创建，不使用Spring AI默认聊天模型。
      chat: none
      # Embedding仍然使用OpenAI兼容协议。
      embedding: openai
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      embedding:
        # 百炼 DashScope Embedding，维度必须与 PGVector 配置保持一致
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
#        base-url: https://ws-kgvn0xlyb793ffzu.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        api-key: ${DASHSCOPE_API_KEY}
#        model: text-embedding-v4
        model: text-embedding-v3
        dimensions: 1024
    vectorstore:
      # 向量库类型：当前项目使用 PostgreSQL + pgvector
      type: pgvector
      pgvector:
        # 公共默认不自动初始化 schema，避免生产环境误删或误改表结构
        initialize-schema: false
        schema-name: public
        table-name: vector_store
        # 向量维度需要和 embedding 模型输出维度一致
        dimensions: 1024
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # 禁止启动时删除已有向量表，保护已入库知识库向量数据
        remove-existing-vector-store-table: false
        schema-validation: false
        max-document-batch-size: 10000
  flyway:
    # Flyway 管理 MySQL 业务表结构迁移
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4
  servlet:
    multipart:
      # 全局安全硬上限；能力字段仍可通过uploadSource.maxSizeMb设置更小限制。
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:110MB}

document:
  parse:
    # 默认关闭 Docling，避免非开发环境未配置地址时误调用
    docling-enabled: true
    # Docling 文件解析接口路径，环境不同优先只覆盖 url
    path: /api/parse/sync
    # Docling 服务地址，生产环境建议通过 DOCLING_URL 注入
#    url: http://localhost:8001
    url: http://192.168.12.84:8001
    # 连接 Docling 的超时时间，单位毫秒
    connect-timeout-ms: 10000
    # 等待 Docling 解析结果的超时时间，单位毫秒
    read-timeout-ms: 120000
app:
  storage:
    ftp:
      # FTP 连接和数据传输超时时间，单位毫秒
      connect-timeout-ms: 10000
      data-timeout-ms: 30000
  vector-task:
    enabled: true
    # 向量化任务轮询间隔，单位毫秒
    poll-delay-ms: 5000
    # 超时任务恢复扫描间隔，单位毫秒
    recover-delay-ms: 60000
    # 单个向量化任务最大处理时间，超过后进入恢复或失败流程
    timeout-minutes: 30
  knowledge-query:
    # 知识库查询使用独立有界线程池，避免占用公共ForkJoinPool。
    timeout-ms: 180000
    executor-core-size: 2
    executor-max-size: 8
    executor-queue-capacity: 100
    shutdown-await-seconds: 30
  external-service-resilience:
    # 连续网络或服务端异常达到阈值后临时熔断，避免故障放大。
    failure-threshold: 5
    open-duration-ms: 30000
  data-retention:
    # 运行数据按固定白名单分批清理，定义、权限和业务文档不参与清理。
    enabled: false
    cron: "0 0 3 * * *"
    batch-size: 500
    max-batches-per-run: 20
    runtime-days: 90
    model-usage-days: 180
    knowledge-query-days: 180
    audit-days: 365
  agent:
    legacy-direct-chat:
      # 旧版模型直连接口默认关闭，紧急回滚时才临时开启。
      enabled: ${LEGACY_DIRECT_CHAT_ENABLED:false}
    stream:
      # 单次SSE连接最长保留3分钟
      timeout-ms: 180000
      # 最终Markdown每个增量事件建议字符数
      chunk-size: 200
      # 默认保持v1，前端适配完成后再调整为2
      default-version: 1
      # v2必须发送最终快照，用于前端完整性修复
      snapshot-enabled: true
      # Agent异步执行线程池配置
      executor-core-size: 4
      executor-max-size: 16
      executor-queue-capacity: 200
      # SSE v2总开关，false时全部回退v1
      v2-enabled: true
      # v2灰度比例，生产环境从5开始
      v2-rollout-percentage: 100
      # 强制进入v2的用户，使用英文逗号分隔
      v2-allow-users: ""
      # 强制回退v1的用户
      v2-deny-users: ""
    # 模型API Key使用独立主密钥加密，不能和SSO会话密钥共用。
    model-security:
      # 当前AES-256主密钥，只允许通过环境变量提供，禁止设置代码默认值。
      encryption-key: ${MODEL_CONFIG_ENCRYPTION_KEY:}
      # 密钥轮换期间用于解密旧密文；轮换完成后必须删除该环境变量。
      previous-encryption-key: ${MODEL_CONFIG_PREVIOUS_ENCRYPTION_KEY:}
    model-config:
      # Redis模型缓存失效频道，只广播modelCode
      cache-invalidation-channel: ${MODEL_CONFIG_CACHE_INVALIDATION_CHANNEL:mc-ai:model-config:changed}
    rate-limit:
      # 普通请求和高成本请求分别限流，Redis负责多实例一致计数。
      enabled: true
      default-requests-per-minute: 120
      expensive-requests-per-minute: 20
      key-prefix: mc-ai:rate-limit
    answer:
      # 标准事实模型开关，紧急回滚时可设为false
      structured-enabled: true
      # Java确定性Markdown开关
      deterministic-markdown-enabled: true

mybatis-plus:
  # MyBatis Plus XML Mapper 扫描路径
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 数据库下划线字段自动映射 Java 驼峰字段
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        # 不要暴露env、configprops等敏感端点
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: mc-ai
agent:
  capability-routing:
    # 最终交给大模型精排的能力数量
    top-k: 5
    # 是否启用关键词 + PGVector 混合召回
    hybrid-enabled: true
    # 两种召回通道的初始候选数量
    keyword-top-k: 10
    vector-top-k: 10
    # 向量召回最低相似度
    min-vector-score: 0.45
    # 混合评分权重
    keyword-weight: 0.40
    vector-weight: 0.60
    dual-hit-bonus: 0.05

    min-recall-score: 0.06
    min-confidence: 0.75
    min-score-margin: 0.12
  sso:
    enabled: true
    pm-base-url: http://192.168.6.183:9999
#    pm-base-url: http://pm.s-ic.cn
    exchange-path: /pm/ai-agent/sso/exchange
    client-id: mc-ai-agent
    client-secret: Dz6idVg6MjSsS7RqBiWTe7q90Lvrz6nw3mwDa17uCwM=
    session-ttl-seconds: 86400
    session-cookie-name: AGENT_SESSION
    # 本地HTTP使用false，正式HTTPS使用true
    cookie-secure: false
    cookie-same-site: Lax
    # Base64编码的32字节AES密钥
    token-encryption-key: gElVCTM7xBc5rsoVGgzjvkp4cbL6UnRXYuHrWzYSfLY=

    # 只填写Origin，不要填写路径或末尾斜杠
    allowed-browser-origins:
      - http://ai-agent.s-ic.cn
      - http://192.168.6.183:9999
#    pm-login-url: http://pm.s-ic.cn/pm-web/#/login
    pm-ai-assistant-url: http://ai-agent.s-ic.cn/pm-web/
    pm-login-url: http://192.168.6.183:8081/pm-web/#/login
#    pm-ai-assistant-url: http://192.168.8.251:8081/pm-web/

ai:
  graph:
    runtime:
      # DAG普通节点线程数
      worker-threads: 8
      # FOREACH任务最大并发数
      foreach-worker-threads: 5
      # 同时允许执行的根工作流数量
      # 正式运行、失败重试、草稿调试共享该限制
      max-concurrent-workflows: 8
  workflow:
    run-recovery:
      # 是否开启卡死运行自动恢复
      enabled: true
      # RUNNING 超过 30 分钟仍未完成，自动标记为 FAILED
      timeout-minutes: 30
      # 服务启动 30 秒后执行第一次恢复
      initial-delay-ms: 30000
      # 此后每 60 秒检查一次
      fixed-delay-ms: 60000
    answer:
      chunk:
        # 每个分块最多字符数，不是业务记录数量限制。
        max-chars: 12000
        # 防止异常业务数据造成无限模型调用。
        # 超过时明确失败，绝不静默截断。
        max-chunks: 2000
      reduce:
        # 每次最多合并8份摘要。
        max-group-items: 8
        # 每组摘要最大字符数，不执行静默截断。
        # 12000调大到15000，减少大数据量报告的分层汇总轮数。
        max-group-chars: 15000
        # 防止异常模型输出导致无限递归汇总。
        max-levels: 10
      analysis:
        # 是否启用模型判定：DATA_QUERY 报告由模型判断是否需要 AI 分析。
        # false 时回退旧逻辑，只按 queryType 决定（ANALYSIS_REPORT 才分析）。
        decision-enabled: true
        # 小数据快路径阈值：分块数不超过该值时一次性生成分析（1次模型调用）。
        lightweight-max-chunks: 3
        # 分块消费受控并发数，限制同时调用模型的请求数量。
        concurrency: 4
        # 分析总超时秒数，超时后保留基础业务报告。
        timeout-seconds: 30
        # 判定调用使用的数据抽样最大字符数。
        sample-max-chars: 2000
      artifact:
        # 安全结果快照保留时间，单位小时。
        # 开发环境建议24小时，正式环境可按审计要求调整。
        retention-hours: 24
